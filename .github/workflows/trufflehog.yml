name: DevSecOps - TruffleHog Secret Scan
on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
jobs:
  trufflehog:
    name: Scan Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # Indispensable pour analyser tout l'historique des commits
      - name: TruffleHog OSS Scan
        uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71 # v3.100.1
        with:
          # Désactive la vérification pour faire apparaître les faux secrets de test
          extra_args: --no-verification